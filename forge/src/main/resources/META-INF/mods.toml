modLoader = "javafml"
loaderVersion = "[53,)"
issueTrackerURL = "https://github.com/FiguraMC/Figura/issues"
license = "Polyform-Noncommercial-1.0.0"
displayURL = "https://github.com/FiguraMC/Figura"

[[mods]]
modId = "figura"
version = "${version}"
displayName = "Figura"
logoFile="assets/figura/icon.png"
authors = "skyrina, lumelia, UnlikePaladin, omoflop"
credits = "TooManyLimits, Lexize, KitCat962, Manuel-3, superpowers04, auriafoxgirl, applejuiceyy"
description = '''
Extensive customization of the Player model
'''

[modproperties.figura]
assets_version="${assets_version}"

[[dependencies.figura]]
modId = "forge"
mandatory = true
versionRange = "[53,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.figura]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "CLIENT"

# this addon is a port of features already included, so we want to trigger
# a "friendly" dependency conflict instead of running into a mixin error
[[dependencies.figura]]
modId = "figurav5addon"
mandatory = false
# why is this something you're allowed to do
versionRange = "[NONE - §cincompatible§r\\nThis addon's features are included in this Figura version!]"
ordering = "NONE"
side = "BOTH"
